name: Demo CI ENV Secrets Inputs v3

on:
    workflow_dispatch:
        
env:
    WORKFLOW_LEVEL_APP_ENV: global-dev

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            JOB_APP_ENV: job-dev

        steps:
            - name: Say Hello
              run: echo "Hello from the Demo CI ENV Secrets Inputs workflow!"

            - name: Install
              env:
                APP_ENV: dev
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "Environment local $APP_ENV joblevel $JOB_APP_ENV workflowlevel $WORKFLOW_LEVEL_APP_ENV using secret DB_PASSWORD $DB_PASSWORD "

